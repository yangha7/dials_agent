[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dials-agent"
version = "2.15.0"
description = "Natural language interface for DIALS crystallography data processing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "DIALS Team"}
]
keywords = ["crystallography", "dials", "ai", "claude", "data-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "websockets>=12.0",
]
mcp = [
    "mcp>=2.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    # Only for testing the pure-Python parts of dials/scripts/centring_vs_pseudocentring_check.py
    # locally without a DIALS install -- the script itself always runs via dials.python/
    # cctbx.python/libtbx.python in production, all of which already bundle scipy.
    "scipy>=1.10.0",
]

[project.scripts]
dials-agent = "dials_agent.cli:main"
dials-agent-mcp = "dials_agent.mcp_server:main"

[project.urls]
Homepage = "https://dials.github.io/"
Repository = "https://github.com/dials/dials"

[tool.setuptools]
packages = ["dials_agent", "dials_agent.core", "dials_agent.dials", "dials_agent.skills"]
package-dir = {"dials_agent" = "."}
